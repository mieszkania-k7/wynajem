<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mieszkania na wynajem</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f5f1">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikona-192.png">
<link rel="apple-touch-icon" href="ikona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wynajem">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d2320; --muted: #66706b; --line: #e3e1da;
    --accent: #2f6f5e; --accent-soft: #e3efe9; --warn: #9a5b00; --warn-soft: #fbefd9; --star: #b7791f;
  }
  :root { color-scheme: light; }   /* zawsze jasna, także gdy telefon ma tryb ciemny */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 12px 16px 10px; padding-top: max(12px, env(safe-area-inset-top)); }
  h1 { font-size: 19px; margin: 0 0 8px; letter-spacing: -.01em; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 14px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, input[type=number] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
           background: var(--card); color: var(--ink); }
  input[type=number] { width: 92px; }
  label.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }
  main { max-width: 760px; margin: 0 auto; padding: 12px 16px 40px; }
  .card { display: grid; grid-template-columns: 120px 1fr; gap: 12px; background: var(--card);
          border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
  .card.new { border-color: var(--accent); }
  .ph { width: 120px; height: 96px; border-radius: 8px; object-fit: cover; background: var(--line); display: block; }
  .t { font-weight: 600; font-size: 16px; }
  .t .star { color: var(--star); }
  .sub { color: var(--muted); font-size: 13.5px; }
  .cost { margin: 4px 0; font-size: 15px; }
  .cost b { font-size: 17px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 5px 0; }
  .tag { font-size: 12.5px; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); white-space: nowrap; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .links a { font-size: 13.5px; color: var(--accent); text-decoration: none; font-weight: 600;
             border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; }
  .ev { font-size: 12px; color: var(--muted); margin-top: 3px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  h2 { font-size: 15px; color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
  .gone { opacity: .55; }
  footer { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; color: var(--muted); font-size: 13px; }
  footer table { border-collapse: collapse; width: 100%; }
  footer td { padding: 3px 6px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .st { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .st button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 99px; cursor: pointer;
               border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .st button.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .st button.on.rej { border-color: #b4483c; background: #fbe6e3; color: #8a2f25; }
  .card.s-odrzucona { opacity: .6; }
  .card.s-zapisana { border-color: #d98b7e; box-shadow: 0 0 0 1px #d98b7e inset; }
  #sync { font-size: 12.5px; color: var(--muted); margin-left: auto; }
  #sync.err { color: #8a2f25; }
  .toast { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--ink); color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 9;
           display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
  .toast button { font: inherit; background: none; border: 0; color: #9fe0cb; font-weight: 600; cursor: pointer; }
  .key { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .key button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line);
                background: var(--card); cursor: pointer; margin-top: 6px; }
  .strip { grid-column: 1 / -1; display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory;
           -webkit-overflow-scrolling: touch; padding-bottom: 2px; scrollbar-width: thin; }
  .strip img { flex: 0 0 auto; width: 132px; height: 96px; object-fit: cover; border-radius: 8px;
               background: var(--line); scroll-snap-align: start; cursor: zoom-in; }
  .ph { cursor: zoom-in; }
  #lb { position: fixed; inset: 0; background: rgba(10,12,11,.94); z-index: 20; display: none;
        align-items: center; justify-content: center; touch-action: pan-y; }
  #lb.open { display: flex; }
  #lb img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; }
  #lb button { position: absolute; background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 99px;
               width: 44px; height: 44px; font-size: 22px; cursor: pointer; }
  #lb .x { top: max(12px, env(safe-area-inset-top)); right: 12px; }
  #lb .p { left: 10px; top: 50%; transform: translateY(-50%); }
  #lb .n { right: 10px; top: 50%; transform: translateY(-50%); }
  #lb .c { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
           color: #ddd; font-size: 14px; }
  #lb .c a { color: #9fe0cb; font-weight: 600; text-decoration: none; margin-left: 10px; }
  @media (max-width: 420px) {
    .strip img { width: 112px; height: 84px; }
    .card { grid-template-columns: 92px 1fr; gap: 10px; }
    .ph { width: 92px; height: 80px; }
  }
</style>
</head>
<body>
<header>
  <h1>Mieszkania na wynajem <small id="count"></small></h1>
  <div class="filters">
    <select id="f-view" aria-label="Widok">
      <option value="aktywne">Do przejrzenia</option>
      <option value="zapisana">❤️ Zapisane</option>
      <option value="obejrzana">👀 Obejrzane</option>
      <option value="odrzucona">✕ Odrzucone</option>
      <option value="wszystkie">Wszystkie</option>
    </select>
    <select id="f-zone" aria-label="Obszar"><option value="">Wszystkie obszary</option></select>
    <label class="chk">maks. <input type="number" id="f-max" step="100" inputmode="numeric"> zł</label>
    <label class="chk"><input type="checkbox" id="f-rent"> tylko z podanym czynszem</label>
    <span id="sync"></span>
  </div>
</header>
<main id="list"></main>
<div id="lb" role="dialog" aria-label="Zdjęcia"><img alt=""><button class="x" aria-label="Zamknij">✕</button>
  <button class="p" aria-label="Poprzednie">‹</button><button class="n" aria-label="Następne">›</button><div class="c"></div></div>
<footer id="foot"></footer>
<script src="dane.js"></script>
<script>
const ZONES = {praga_poludnie: "Praga-Południe", praga_polnoc: "Praga-Północ",
  targowek_mieszkaniowy: "Targówek Mieszkaniowy", siekierki: "Siekierki", ursynow: "Ursynów",
  kolej: "Wawer, Wesoła, Sulejówek i okolice", osiedle_wilno: "Osiedle Wilno"};
const D = window.DANE || {offers: [], gone: [], sources: []};
const $ = s => document.querySelector(s);
const zl = v => v == null ? "?" : Math.round(v).toLocaleString("pl-PL") + " zł";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmtDate = s => s ? new Date(s.length <= 10 ? s + "T12:00" : s).toLocaleDateString("pl-PL", {day: "numeric", month: "short"}) : "";
const fmtTime = s => s ? new Date(s).toLocaleString("pl-PL", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "–";

let lastVisit = null;
try { lastVisit = localStorage.getItem("ostatnia_wizyta"); localStorage.setItem("ostatnia_wizyta", D.generated || ""); } catch (e) {}
try { const s = JSON.parse(localStorage.getItem("filtry") || "{}");
  if (s.view) $("#f-view").value = s.view; if (s.zone) $("#f-zone").dataset.v = s.zone; if (s.max) $("#f-max").value = s.max; if (s.rent) $("#f-rent").checked = true; } catch (e) {}

const zonesPresent = [...new Set(D.offers.map(o => o.zone))];
for (const [k, v] of Object.entries(ZONES)) if (zonesPresent.includes(k)) $("#f-zone").insertAdjacentHTML("beforeend", `<option value="${k}">${v}</option>`);
if ($("#f-zone").dataset.v) $("#f-zone").value = $("#f-zone").dataset.v;
$("#f-max").placeholder = D.koszt_max || 5500;

function card(o, gone) {
  const isNew = !gone && lastVisit && o.first_seen > lastVisit;
  const place = o.area_label.split(" · ");
  const title = `${o.star ? '<span class="star">⭐</span> ' : ""}${esc(place[place.length - 1])} · ${o.area ?? "?"} m²${o.rooms ? " · " + o.rooms + " pok." : ""}`;
  let cost;
  if (o.rent == null) cost = `<b>${zl(o.price)}</b> + czynsz ?`;
  else if (o.rent === 0) cost = `<b>${zl(o.price)}</b> <span class="sub">(czynsz w cenie)</span>`;
  else cost = `${zl(o.price)} + czynsz ${zl(o.rent)} = <b>${zl(o.total)}</b>`;
  const tags = [];
  if (o.rent == null) tags.push(`<span class="tag warn">⚠️ czynsz nieznany</span>`);
  if (o.approx) tags.push(`<span class="tag warn">📍 lokalizacja przybliżona</span>`);
  tags.push(`<span class="tag">🐕 ${o.pets === "tak" ? "tak" : o.pets === "nie" ? "nie" : "brak info"}</span>`);
  if (o.commission) tags.push(`<span class="tag">prowizja</span>`);
  if (o.institutional) tags.push(`<span class="tag">🏢 instytucjonalny</span>`);
  if (o.praga_agency) tags.push(`<span class="tag">biuro z Pragi Płd.</span>`);
  for (const s of o.stations || []) tags.push(`<span class="tag">${esc(s)}</span>`);
  const ev = [];
  if (o.rent_evidence) ev.push(`czynsz: ${esc(o.rent_evidence)}`);
  if (o.pets_evidence) ev.push(`zwierzęta: ${esc(o.pets_evidence)}`);
  if (o.commission_evidence) ev.push(`prowizja: ${esc(o.commission_evidence)}`);
  const links = o.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("");
  const pics = (o.photos && o.photos.length ? o.photos : (o.photo ? [o.photo] : []));
  const strip = pics.length > 1 ? `<div class="strip">${pics.slice(1).map((u, i) =>
    `<img loading="lazy" src="${esc(u)}" alt="" referrerpolicy="no-referrer" data-gal="${esc(o.id)}" data-i="${i + 1}">`).join("")}</div>` : "";
  const img = o.photo ? `<img class="ph" loading="lazy" src="${esc(o.photo)}" alt="" referrerpolicy="no-referrer">` : `<div class="ph"></div>`;
  const st = (S[o.id] || {}).status;
  const btn = (k, txt) => `<button data-id="${esc(o.id)}" data-s="${k}" class="${st === k ? "on" : ""}${k === "odrzucona" ? " rej" : ""}">${txt}</button>`;
  const stBtns = `<div class="st">${btn("zapisana", "❤️ Zapisz")}${btn("obejrzana", "👀 Obejrzana")}${btn("odrzucona", "✕ Odrzuć")}</div>`;
  return `<article class="card${isNew && !st ? " new" : ""}${gone ? " gone" : ""}${st ? " s-" + st : ""}">
    <div data-gal="${esc(o.id)}" data-i="0">${img}</div>
    <div>
      <div class="t">${title}</div>
      <div class="sub">${esc(o.area_label)}${o.street ? " · " + (/^(al|pl|os)\.|^rondo/i.test(o.street) ? "" : "ul. ") + esc(o.street) : ""}${o.floor ? " · piętro " + esc(o.floor) : ""}</div>
      <div class="cost">${cost}</div>
      <div class="tags">${tags.join("")}</div>
      <div class="sub">${isNew ? "🆕 " : ""}${gone ? "zniknęło " + fmtDate(o.gone_at) : "dodane " + fmtDate(o.date_created || o.first_seen)}${o.agencies.length ? " · " + esc(o.agencies.join(", ")) : ""}</div>
      <div class="links">${links}</div>
      ${stBtns}
      ${ev.length ? `<details><summary>skąd te informacje</summary><div class="ev">${ev.join("<br>")}</div></details>` : ""}
    </div>${strip}</article>`;
}

function render() {
  const zone = $("#f-zone").value, max = +$("#f-max").value || Infinity, onlyRent = $("#f-rent").checked, view = $("#f-view").value;
  try { localStorage.setItem("filtry", JSON.stringify({zone, max: $("#f-max").value, rent: onlyRent, view})); } catch (e) {}
  const stOf = o => (S[o.id] || {}).status;
  const okView = o => view === "wszystkie" ? true : view === "aktywne" ? stOf(o) !== "odrzucona" : stOf(o) === view;
  const ok = o => okView(o) && (!zone || o.zone === zone) && (o.rent == null ? o.price : o.total) <= max && (!onlyRent || o.rent != null);
  const list = D.offers.filter(ok);
  $("#count").textContent = `· ${list.length}`;
  let html = list.map(o => card(o, false)).join("") || `<div class="empty">Brak ofert dla tych filtrów.</div>`;
  const gone = D.gone.filter(ok);
  if (gone.length) html += `<h2>Nieaktualne (zniknęły z portali w ostatnich 14 dniach)</h2>` + gone.map(o => card(o, true)).join("");
  $("#list").innerHTML = html;
}
["#f-view", "#f-zone", "#f-max", "#f-rent"].forEach(s => $(s).addEventListener("input", render));

// ================= STATUSY (wspólne dla wszystkich urządzeń – plik docs/statusy.json na GitHubie) =========
const REPO = "mieszkania-k7/wynajem", PATH = "docs/statusy.json", API = `https://api.github.com/repos/${REPO}/contents/${PATH}`;
const NOREPLY = {name: "mieszkania-k7", email: "354105258+mieszkania-k7@users.noreply.github.com"};
let S = {};                                   // {id_oferty: {status, at}}
let pending = {};                             // zmiany jeszcze niezapisane na GitHubie
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
try { pending = JSON.parse(ls("statusy_oczekujace") || "{}"); } catch (e) {}
const token = () => ls("github_klucz");
const hdr = () => ({Authorization: `Bearer ${token()}`, Accept: "application/vnd.github+json"});
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), c => c.charCodeAt(0)));
const b64enc = str => { const by = new TextEncoder().encode(str); let s = ""; for (const x of by) s += String.fromCharCode(x); return btoa(s); };
const syncMsg = (t, err) => { $("#sync").textContent = t; $("#sync").className = err ? "err" : ""; };

async function remote() {
  if (token()) {
    const r = await fetch(API + "?t=" + Date.now(), {headers: hdr(), cache: "no-store"});
    if (r.status === 404) return {data: {}, sha: null};
    if (!r.ok) throw new Error("GitHub " + r.status);
    const j = await r.json();
    return {data: JSON.parse(b64dec(j.content) || "{}"), sha: j.sha};
  }
  const r = await fetch("statusy.json?t=" + Date.now(), {cache: "no-store"});
  return {data: r.ok ? await r.json() : {}, sha: null};
}
function applyPending(data) {
  for (const [id, v] of Object.entries(pending)) { if (v === null) delete data[id]; else data[id] = v; }
  return data;
}
async function loadStatuses() {
  try { S = applyPending((await remote()).data); } catch (e) { S = applyPending({}); syncMsg("⚠️ nie udało się wczytać statusów", true); }
  render();
  if (Object.keys(pending).length) flush();
}
let flushing = false;
async function flush() {
  if (!token()) { syncMsg(Object.keys(pending).length ? "⚠️ statusy tylko na tym urządzeniu – podłącz klucz (na dole)" : "", true); return; }
  if (flushing) return; flushing = true;
  syncMsg("zapisuję…");
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const {data, sha} = await remote();
      const sent = {...pending};
      const merged = applyPending(data);
      const r = await fetch(API, {method: "PUT", headers: {...hdr(), "Content-Type": "application/json"},
        body: JSON.stringify({message: "Statusy ofert",
          // podpis anonimowym adresem GitHuba – bez tego GitHub wpisałby prawdziwy e-mail konta
          committer: NOREPLY, author: NOREPLY, content: b64enc(JSON.stringify(merged, null, 1) + "\n"), ...(sha ? {sha} : {})})});
      if (r.ok) {
        for (const [id, v] of Object.entries(sent)) if (JSON.stringify(pending[id]) === JSON.stringify(v)) delete pending[id];
        ls("statusy_oczekujace", JSON.stringify(pending));
        S = applyPending(merged);
        syncMsg("✓ zapisano");
        break;
      }
      if (r.status === 401 || r.status === 403) { syncMsg("⚠️ klucz nie działa – sprawdź go na dole strony", true); break; }
      if (attempt === 2) syncMsg("⚠️ nie zapisano – spróbuję przy następnej zmianie", true);
    }
  } catch (e) { syncMsg("⚠️ brak połączenia – zapiszę później", true); }
  flushing = false;
  if (Object.keys(pending).length && token() && !$("#sync").classList.contains("err")) setTimeout(flush, 500);
}
const LABELS = {zapisana: "Zapisano ❤️", obejrzana: "Oznaczono jako obejrzane 👀", odrzucona: "Odrzucono – nie będzie jej w „Do przejrzenia”"};
function setStatus(id, status) {
  const prev = S[id] || null;
  const next = status ? {status, at: new Date().toISOString()} : null;
  if (next) S[id] = next; else delete S[id];
  pending[id] = next;
  ls("statusy_oczekujace", JSON.stringify(pending));
  render();
  toast(status ? LABELS[status] : "Usunięto status", () => setStatus(id, prev ? prev.status : null));
  clearTimeout(setStatus.t); setStatus.t = setTimeout(flush, 800);
}
function toast(text, undo) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<span>${esc(text)}</span>` + (undo ? `<button>Cofnij</button>` : "");
  if (undo) el.querySelector("button").onclick = () => { el.remove(); undo(); };
  document.body.appendChild(el); setTimeout(() => el.remove(), 4000);
}
$("#list").addEventListener("click", e => {
  const b = e.target.closest(".st button"); if (!b) return;
  const id = b.dataset.id, s = b.dataset.s;
  setStatus(id, (S[id] || {}).status === s ? null : s);
});
function keyBox() {
  const has = !!token();
  return `<div class="key">🔑 <b>Zapis statusów:</b> ${has ? "połączono z GitHubem – statusy widać na każdym urządzeniu."
    : "nie połączono – statusy zapisują się tylko na tym urządzeniu."}<br>
    <div id="key-form" style="display:${has ? "none" : "block"}">
      <input id="key-in" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="wklej klucz github_pat_…" style="font:inherit;width:100%;margin-top:6px;padding:7px 8px;border:1px solid var(--line);border-radius:8px">
      <button id="key-save">Zapisz klucz</button> <span id="key-msg"></span>
    </div>
    ${has ? `<button id="key-show">Zmień klucz</button> <button id="key-del">Odłącz</button>` : ""}</div>`;
}
async function setKey() {
  const t = ($("#key-in").value || "").trim();
  if (!t) { $("#key-msg").textContent = "Najpierw wklej klucz w pole powyżej."; return; }
  $("#key-msg").textContent = "sprawdzam…";
  ls("github_klucz", t);
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}`, {headers: hdr()});
    const j = await r.json();
    if (!r.ok || !(j.permissions && j.permissions.push)) throw new Error();
    toast("Klucz działa ✓ – statusy będą wspólne");
  } catch (e) {
    ls("github_klucz", null);
    $("#key-msg").textContent = "❌ Ten klucz nie działa (brak zapisu w repozytorium wynajem). Sprawdź, czy skopiowałaś go w całości.";
    return;
  }
  drawFoot(); loadStatuses();
}

// ================= GALERIA ZDJĘĆ =================
const BY_ID = Object.fromEntries([...D.offers, ...D.gone].map(o => [o.id, o]));
let gal = {pics: [], i: 0, offer: null};
function galShow() {
  const lb = $("#lb");
  lb.querySelector("img").src = gal.pics[gal.i];
  lb.querySelector(".c").innerHTML = `${gal.i + 1} / ${gal.pics.length}` +
    (gal.offer ? `<a href="${esc(gal.offer.links[0].url)}" target="_blank" rel="noopener">ogłoszenie ↗</a>` : "");
  lb.querySelector(".p").style.display = lb.querySelector(".n").style.display = gal.pics.length > 1 ? "" : "none";
}
function galOpen(id, i) {
  const o = BY_ID[id]; if (!o) return;
  const pics = o.photos && o.photos.length ? o.photos : (o.photo ? [o.photo] : []);
  if (!pics.length) return;
  gal = {pics, i: Math.min(i, pics.length - 1), offer: o};
  $("#lb").classList.add("open"); document.body.style.overflow = "hidden"; galShow();
}
function galClose() { $("#lb").classList.remove("open"); document.body.style.overflow = ""; }
const galStep = d => { gal.i = (gal.i + d + gal.pics.length) % gal.pics.length; galShow(); };
$("#list").addEventListener("click", e => {
  const t = e.target.closest("[data-gal]"); if (t) galOpen(t.dataset.gal, +t.dataset.i);
});
$("#lb .x").onclick = galClose;
$("#lb .p").onclick = e => { e.stopPropagation(); galStep(-1); };
$("#lb .n").onclick = e => { e.stopPropagation(); galStep(1); };
$("#lb").addEventListener("click", e => { if (e.target.id === "lb") galClose(); });
document.addEventListener("keydown", e => {
  if (!$("#lb").classList.contains("open")) return;
  if (e.key === "Escape") galClose(); else if (e.key === "ArrowRight") galStep(1); else if (e.key === "ArrowLeft") galStep(-1);
});
let tx = null;
$("#lb").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive: true});
$("#lb").addEventListener("touchend", e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 40) galStep(dx < 0 ? 1 : -1);
});

function drawFoot() {
$("#foot").innerHTML = `<p>Ostatnie wyszukiwanie: <b>${fmtTime(D.generated)}</b></p><table>` +
  D.sources.map(s => `<tr><td>${s.ok ? "✅" : "❌"} ${esc(s.label)}</td><td>${s.ok ? s.count + " ofert" :
   "nie działa" + (s.failures ? ` (${s.failures}× z rzędu)` : "") + (s.error ? ": " + esc(s.error) : "")}</td></tr>`).join("") + `</table>` + keyBox();
  $("#key-save").onclick = setKey;
  if ($("#key-show")) $("#key-show").onclick = () => { $("#key-form").style.display = "block"; $("#key-in").focus(); };
  if ($("#key-del")) $("#key-del").onclick = () => { ls("github_klucz", null); drawFoot(); toast("Odłączono klucz na tym urządzeniu"); };
}
drawFoot();
render();
loadStatuses();

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
</script>
