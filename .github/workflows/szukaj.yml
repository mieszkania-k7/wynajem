# Wyszukiwanie w chmurze GitHuba.
# Domyślnie TYLKO ręcznie (zakładka Actions → „Szukaj mieszkań” → Run workflow) – główne wyszukiwanie
# robi Mac. Żeby wyszukiwanie działało w chmurze automatycznie, usuń znaki # przed „schedule” i „cron”
# (i wyłącz harmonogram na Macu, żeby nie szukały oba naraz).
name: Szukaj mieszkań

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "5 7,14,19 * * *"   # 8:05, 15:05, 20:05 zimą (czas UTC; latem godzinę później)

permissions:
  contents: write

concurrency:
  group: szukaj
  cancel-in-progress: false

jobs:
  szukaj:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Wyszukiwanie
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: uv run wynajem szukaj ${{ github.event_name == 'workflow_dispatch' && '--wymus' || '' }}
      - name: Zapis wyników
        run: |
          git config user.name "wyszukiwarka"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "Wyszukiwanie (chmura) $(date -u +%F' '%H:%M)" && git push)
